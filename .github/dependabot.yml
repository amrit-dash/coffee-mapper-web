version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    target-branch: "develop"
    labels:
      - "dependencies"
      - "pub"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Riverpod 3.x requires a code migration (StateNotifier/StateProvider
      # removed). Re-enable major bumps once the migration is done.
      - dependency-name: "riverpod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flutter_riverpod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hooks_riverpod"
        update-types: ["version-update:semver-major"]
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_firestore*"
          - "_flutterfire_internals"
      riverpod:
        patterns:
          - "riverpod"
          - "flutter_riverpod"
          - "hooks_riverpod"
      google-maps:
        patterns:
          - "google_maps_flutter*"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    target-branch: "develop"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
