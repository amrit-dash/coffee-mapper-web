name: Flutter Web

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  FLUTTER_VERSION: '3.29.0'
  FIREBASE_CLI_VERSION: 12.9.1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://coffeemapper.web.app' || 'https://coffee-mapper-dashboard.web.app' }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true  # Using Flutter's built-in caching

      - name: Install Firebase CLI
        run: |
          curl -sL https://firebase.tools | bash
          firebase --version
      
      # Set up Firebase configuration
      - name: Create Firebase Config Files
        env:
          FIREBASE_OPTIONS_DEV: ${{ secrets.FIREBASE_OPTIONS_DEV }}
          FIREBASE_OPTIONS_PROD: ${{ secrets.FIREBASE_OPTIONS_PROD }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
          FIREBASE_RC: ${{ secrets.FIREBASE_RC }}
          FIREBASE_RULES: ${{ secrets.FIREBASE_RULES }}
          STORAGE_RULES: ${{ secrets.STORAGE_RULES }}
          FIREBASE_INDEXES: ${{ secrets.FIREBASE_INDEXES }}
        run: |
          # Write config from secrets via env vars + printf so the file contents
          # (which contain double quotes and rules syntax) are never re-parsed by
          # the shell. Interpolating secrets directly into the script body breaks
          # as soon as a payload contains a quote.
          printf '%s' "$FIREBASE_OPTIONS_DEV" > lib/config/firebase_options_dev.dart
          printf '%s' "$FIREBASE_OPTIONS_PROD" > lib/config/firebase_options_prod.dart
          printf '%s' "$FIREBASE_JSON" > firebase.json
          printf '%s' "$FIREBASE_RC" > .firebaserc
          printf '%s' "$FIREBASE_RULES" > firestore.rules
          printf '%s' "$STORAGE_RULES" > storage.rules
          printf '%s' "$FIREBASE_INDEXES" > firestore.indexes.json

          # Validate JSON config
          if ! jq empty firebase.json; then
            echo "Invalid firebase.json JSON"
            exit 1
          fi
          if ! jq empty .firebaserc; then
            echo "Invalid .firebaserc JSON"
            exit 1
          fi

          # Leak-safe diagnostics (counts only, never the secret value)
          echo "dev bytes:  $(wc -c < lib/config/firebase_options_dev.dart)"
          echo "prod bytes: $(wc -c < lib/config/firebase_options_prod.dart)"
          echo "dev 'class' lines:          $(grep -c 'class ' lib/config/firebase_options_dev.dart || true)"
          echo "dev 'FirebaseOptions' lines: $(grep -c 'FirebaseOptions' lib/config/firebase_options_dev.dart || true)"
          echo "dev 'DefaultFirebaseOptions': $(grep -c 'DefaultFirebaseOptions' lib/config/firebase_options_dev.dart || true)"

          # Verify Firebase options
          if ! grep -q "DefaultFirebaseOptions" lib/config/firebase_options_dev.dart; then
            echo "Invalid firebase_options_dev.dart: Missing DefaultFirebaseOptions class"
            exit 1
          fi
          if ! grep -q "DefaultFirebaseOptions" lib/config/firebase_options_prod.dart; then
            echo "Invalid firebase_options_prod.dart: Missing DefaultFirebaseOptions class"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get
        
      - name: Format code
        run: dart format .
        
      - name: Verify formatting
        run: |
          # Format any generated files first
          dart format .
          # Now verify that everything is formatted
          dart format --output=none --set-exit-if-changed .
        
      - name: Analyze project source
        run: flutter analyze --no-fatal-infos
        
      - name: Build web
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            flutter build web --release --dart-define=ENVIRONMENT=production
          else
            flutter build web --release --dart-define=ENVIRONMENT=development
          fi

      # Production Deployment
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Deploy only hosting to all production sites
          firebase deploy --only hosting:cdt-koraput,hosting:coffeemapper,hosting:cdtkoraput,hosting:cdtdashboard --project "${{ secrets.FIREBASE_PROJECT_ID_PROD }}"
          
      # Development Deployment
      - name: Deploy to Development
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Deploy only hosting to development site
          firebase deploy --only hosting:coffee-mapper-dashboard --project "${{ secrets.FIREBASE_PROJECT_ID_DEV }}" 